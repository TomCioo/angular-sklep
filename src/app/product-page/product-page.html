<div class="product">

  <div class="product-image">

    <img [src]="product!.image" [alt]="product!.name">

  </div>

  <div class="product-info">

    <h1>{{ product?.name }}</h1>

    <p class="price">
      {{ product?.price }} zł
    </p>

    <p>
      {{ product?.description }}
    </p>

    <p class="rating">
      ⭐ {{ product?.rating }} / 5
    </p>

    <button mat-raised-button (click)="addToCart()">
      Dodaj do koszyka
    </button>

  </div>

</div>


<h2>Pozostałe produkty</h2>

<swiper-container
  slides-per-view="3"
  space-between="15"
  navigation="true">

  @for (item of otherProducts; track item.id) {

    <swiper-slide>

      <div class="carousel-product">

        <img
          [src]="item.image"
          [alt]="item.name">

        <h3>{{ item.name }}</h3>

        <p>{{ item.price }} zł</p>

        <a
          mat-raised-button
          [routerLink]="['/product', item.id]">
          Zobacz produkt
        </a>

      </div>

    </swiper-slide>

  }

</swiper-container>
